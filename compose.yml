volumes:
  shared_data:
    driver: local
  garage_data:
    driver: local
  garage_meta:
    driver: local

services:
  app:
    build:
      context: app
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/data
    environment:
      DATABASE_URL: &db_url "sqlite:////data/recipes.db"
    networks:
      - recipe-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      retries: 5

  app_tests:
    build: app_tests
    environment:
      API_BASE_URL: "http://app:8000"
    command: pytest tests/ -v
    depends_on:
      app:
        condition: service_healthy
    networks:
      - recipe-network

  garage:
    image: dxflrs/garage:v1.0.1
    ports:
      - "3900:3900"  # S3 API
      - "3902:3902"  # K2V API
      - "3903:3903"  # Admin API
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./garage/garage.toml:/etc/garage.toml
    networks:
      - recipe-network

  ingest:
    build:
      context: ingest
    volumes:
      - shared_data:/data
    environment:
      DATABASE_URL: *db_url
      #DESTINATION__DUCKDB__BUCKET_URL: "duckdb:////data/warehouse.duckdb"
    depends_on:
      app:
        condition: service_healthy
      app_tests:
        condition: service_completed_successfully
    networks:
      - recipe-network

  transform:
    build:
      context: transform
    volumes:
      - shared_data:/data
    depends_on:
      ingest:
        condition: service_completed_successfully
    networks:
      - recipe-network

  integration_tests:
    build:
      context: transform
    depends_on:
      app_tests:
        condition: service_completed_successfully
      ingest:
        condition: service_completed_successfully
      transform:
        condition: service_completed_successfully
    networks:
      - recipe-network

networks:
  recipe-network:
    name: recipe-network
    external: true
