# Simple compose file for testing S3 Garage in isolation
services:
  garage:
    build: .
    network_mode: "host"
    container_name: garage
    # restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3902:3902" # K2V API
      - "3903:3903" # Admin API
    # volumes:
    #   - ./data:/var/lib/garage/data
    #   - ./meta:/var/lib/garage/meta
    #   - ./garage.toml:/etc/garage.toml
